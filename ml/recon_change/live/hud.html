<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beacon directions</title>
<!--
  The glasses display: an arrow and a distance to a named place ("pill box", "bathroom door").

  It draws one position fix: where the wearer stands, which way they face, and where the places
  are. Fixes come from the relay (GET /where?zone=..., polled), made by POST /locate with a
  photo of what the wearer sees. The display is the black 600 x 600 square; everything under it
  is for the demo only. Black is "off" on a see-through display, so the square stays mostly black.

  /hud?k=KEY            live, from the relay
  /hud?k=KEY&demo=1     sample room, no relay needed: arrow keys or the buttons turn and walk
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: #15171a; color: #d6d9de; font: 15px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #display { width: min(600px, calc(100vw - 24px)); aspect-ratio: 1; background: #000; border-radius: 20px; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; max-width: 600px; }
  button, select, label.file { font: inherit; color: inherit; background: #262a30; border: 1px solid #3a4048; border-radius: 10px;
                               padding: 8px 12px; cursor: pointer; }
  button.on { background: #1f6f43; border-color: #2c9a5e; color: #fff; }
  label.file input { display: none; }
  #note { color: #9aa1ab; text-align: center; max-width: 600px; min-height: 1.4em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<svg id="display" viewBox="0 0 600 600" role="img" aria-label="Directions">
  <defs><clipPath id="disc"><circle cx="0" cy="0" r="92"/></clipPath></defs>
  <text id="going" x="300" y="58" text-anchor="middle" fill="#7fd6a4" font-size="22" letter-spacing="3">GOING TO</text>
  <text id="place" x="300" y="108" text-anchor="middle" fill="#fff" font-size="46" font-weight="600"></text>

  <g id="compass" transform="translate(300 290)">
    <circle r="118" fill="none" stroke="#1d4d33" stroke-width="3"/>
    <g id="arrow"><path d="M0 -100 L62 30 L22 14 L22 96 L-22 96 L-22 14 L-62 30 Z" fill="#3ddc84"/></g>
    <g id="there" hidden><circle r="70" fill="none" stroke="#3ddc84" stroke-width="10"/><path d="M-34 2 L-8 30 L38 -26" fill="none" stroke="#3ddc84" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="lost" hidden><circle r="70" fill="none" stroke="#f0b429" stroke-width="8" stroke-dasharray="14 12"/><text y="22" text-anchor="middle" fill="#f0b429" font-size="64" font-weight="700">?</text></g>
  </g>

  <text id="turn" x="400" y="468" text-anchor="middle" fill="#fff" font-size="40" font-weight="600"></text>
  <text id="far" x="400" y="512" text-anchor="middle" fill="#7fd6a4" font-size="30"></text>
  <text id="age" x="400" y="572" text-anchor="middle" fill="#55606c" font-size="18"></text>

  <g transform="translate(104 496)">
    <circle r="94" fill="#000" stroke="#1d4d33" stroke-width="2"/>
    <g clip-path="url(#disc)"><g id="map"></g></g>
    <path d="M0 -13 L9 10 L0 5 L-9 10 Z" fill="#4aa3ff"/>
  </g>
</svg>

<div class="row" id="targets"></div>
<div class="row">
  <select id="zone" title="Room"></select>
  <label class="file">Take a photo to update<input id="photo" type="file" accept="image/*,video/*" capture="environment"></label>
  <button id="camera" hidden>Use this camera</button>
  <button id="demo">Sample room</button>
</div>
<div class="row" id="pad" hidden>
  <button data-turn="-15">Turn left</button><button data-walk="0.4">Walk</button><button data-turn="15">Turn right</button>
</div>
<div id="note"></div>
<video id="video" playsinline muted hidden></video>

<script>
const query = new URLSearchParams(location.search);
const key = query.get('k') || '';
const $ = id => document.getElementById(id);
const api = (path, more = '') => `${path}?k=${encodeURIComponent(key)}${more}`;
const wrap = deg => ((deg + 180) % 360 + 360) % 360 - 180;

let demo = query.has('demo');
let zone = query.get('zone') || '';
let target = query.get('to') || '';
let fix = null;                       // the latest fix from the relay (or the sample room)
let me = { x: 0, y: 0, heading: 0 };  // where the wearer is now: the fix, moved by the compass or the demo keys
let fixSeen = '', compass = null, compassAtFix = null, gotAt = 0;

// ---------------------------------------------------------------- drawing
function draw() {
  const places = fix ? fix.waypoints : [];
  const lost = !fix || fix.state === 'lost';
  const to = places.find(p => p.name === target) || places[0];
  $('place').textContent = to ? to.name : (fix ? 'No places named yet' : 'Waiting for a position');
  $('going').setAttribute('visibility', to ? 'visible' : 'hidden');
  let east = 0, north = 0, far = 0, bearing = 0;
  if (to) {
    east = to.position[0] - me.x; north = to.position[1] - me.y;
    far = Math.hypot(east, north);
    bearing = wrap(Math.atan2(east, north) * 180 / Math.PI - me.heading);  // 0 ahead, + to the right
  }
  const there = to && !lost && far < 0.8;
  $('arrow').hidden = lost || !to || there;
  $('there').hidden = !there;
  $('lost').hidden = !lost || !fix;
  $('arrow').setAttribute('transform', `rotate(${bearing.toFixed(1)})`);
  const side = bearing > 0 ? 'right' : 'left', off = Math.abs(bearing);
  $('turn').textContent = !fix ? '' : lost ? 'Look around slowly' : !to ? '' : there ? 'You are there'
    : off <= 15 ? 'Straight ahead' : off <= 60 ? `Slightly ${side}` : off <= 135 ? `Turn ${side}` : 'Turn around';
  $('far').textContent = lost || !to || there ? '' : `about ${far < 3 ? (Math.round(far * 2) / 2 || 0.5) : Math.round(far)} m`;
  $('age').textContent = !fix ? '' : demo ? 'sample room' : `${fix.state === 'unsure' ? 'rough fix, ' : ''}updated ${Math.round((Date.now() - gotAt) / 1000 + (fix.age_s || 0))} s ago`;

  // Mini map, heading up: 1 m = 26 px, the wearer at the centre.
  const dots = fix ? fix.map.points.map(p => `<rect x="${(p[0] * 26).toFixed(1)}" y="${(-p[1] * 26).toFixed(1)}" width="2.4" height="2.4" fill="#2f7d55"/>`).join('') : '';
  const pins = places.map(p => `<circle cx="${p.position[0] * 26}" cy="${-p.position[1] * 26}" r="${p === to ? 8 : 5}" fill="${p === to ? '#ffd23f' : '#8a7a2a'}"/>`).join('');
  $('map').innerHTML = dots + pins;
  $('map').setAttribute('transform', `rotate(${(-me.heading).toFixed(1)}) translate(${(-me.x * 26).toFixed(1)} ${(me.y * 26).toFixed(1)})`);

  $('targets').innerHTML = places.map(p => `<button class="${p === to ? 'on' : ''}" data-to="${encodeURIComponent(p.name)}">${p.name.replace(/[<&]/g, '')}</button>`).join('');
}

function take(next) {
  fix = next; gotAt = Date.now();
  const stamp = next.ts + next.job;
  if (stamp !== fixSeen) {  // a new fix: stand where it says, and remember the compass reading at that moment
    fixSeen = stamp;
    me = { x: next.position[0], y: next.position[1], heading: next.heading_deg };
    compassAtFix = compass;
  }
  draw();
}

// ---------------------------------------------------------------- sample room
function sampleRoom() {
  const points = [];
  for (let t = -2; t <= 2; t += 0.12) points.push([t, 4.2], [t, -1.2]);
  for (let t = -1.2; t <= 4.2; t += 0.12) points.push([-2, t], [2, t]);
  for (let t = 0; t <= 1; t += 0.12) points.push([0.6 + t, 3.4], [0.6 + t, 4.0], [-1.9, 0.2 + t]);
  return { state: 'found', confidence: 1, position: [0, 0, 0], heading_deg: 0, ts: 'sample', job: '', map: { points },
           waypoints: [{ name: 'pill box', position: [1.2, 3.6, 0] }, { name: 'bathroom door', position: [-1.9, 2.4, 0] },
                       { name: 'front door', position: [0.4, -1.1, 0] }] };
}

function move(turn, walk) {
  me.heading = wrap(me.heading + turn);
  me.x += Math.sin(me.heading * Math.PI / 180) * walk;
  me.y += Math.cos(me.heading * Math.PI / 180) * walk;
  draw();
}

// ---------------------------------------------------------------- relay
async function poll() {
  if (demo) return;
  try {
    const reply = await fetch(api('/where', zone ? `&zone=${zone}` : ''));
    if (reply.ok) take(await reply.json());
    else if (!fix) $('note').textContent = 'No position yet. Take a photo of what you see.';
  } catch { $('note').textContent = 'Cannot reach the relay.'; }
}

async function send(blob) {
  if (!zone) { $('note').textContent = 'Record a baseline of the room first (phone page).'; return; }
  $('note').textContent = 'Working out where you are…';
  const t0 = Date.now();
  try {
    const reply = await fetch(api('/locate', `&zone=${zone}`), { method: 'POST', body: blob });
    const body = await reply.json();
    if (!reply.ok) { $('note').textContent = body.error || 'That did not work.'; return; }
    demo = false; $('pad').hidden = true; $('demo').classList.remove('on');
    take(body);
    $('note').textContent = `${body.headline}. ${body.detail} (${((Date.now() - t0) / 1000).toFixed(0)} s)`;
  } catch { $('note').textContent = 'Cannot reach the relay.'; }
}

async function zones() {
  try {
    const status = await (await fetch(api('/status'))).json();
    const names = status.zones || [];
    if (!names.includes(zone)) zone = names[0] || '';
    $('zone').innerHTML = names.map(n => `<option${n === zone ? ' selected' : ''}>${n}</option>`).join('');
  } catch { /* the relay is down: the sample room still works */ }
}

// ---------------------------------------------------------------- controls
$('targets').onclick = e => { if (e.target.dataset.to) { target = decodeURIComponent(e.target.dataset.to); draw(); } };
$('zone').onchange = e => { zone = e.target.value; fixSeen = ''; poll(); };
$('photo').onchange = e => { if (e.target.files[0]) send(e.target.files[0]); e.target.value = ''; };
$('demo').onclick = () => { demo = !demo; $('demo').classList.toggle('on', demo); $('pad').hidden = !demo; fixSeen = ''; if (demo) take(sampleRoom()); else { fix = null; draw(); poll(); } };
$('pad').onclick = e => { const d = e.target.dataset; if (d.turn || d.walk) move(+d.turn || 0, +d.walk || 0); };
addEventListener('keydown', e => {
  if (!demo) return;
  const step = { ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, 0.25], ArrowDown: [0, -0.25] }[e.key];
  if (step) { e.preventDefault(); move(...step); }
});

// Between fixes, a phone's compass keeps the arrow turning with the wearer (needs HTTPS on most phones).
addEventListener('deviceorientationabsolute', e => {
  if (e.alpha == null || demo || !fix) return;
  compass = 360 - e.alpha;  // clockwise from north
  if (compassAtFix == null) compassAtFix = compass;
  me.heading = wrap(fix.heading_deg + compass - compassAtFix);
  draw();
});

// A laptop or phone camera (HTTPS or localhost only): send a frame every few seconds.
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  $('camera').hidden = false;
  let timer = null;
  $('camera').onclick = async () => {
    if (timer) { clearInterval(timer); timer = null; $('video').srcObject.getTracks().forEach(t => t.stop()); $('camera').classList.remove('on'); return; }
    try {
      $('video').srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 960 } });
      await $('video').play();
    } catch { $('note').textContent = 'The camera is not available here.'; return; }
    $('camera').classList.add('on');
    let busy = false;
    const shot = async () => {
      if (busy) return;
      busy = true;
      const canvas = document.createElement('canvas');
      canvas.width = $('video').videoWidth; canvas.height = $('video').videoHeight;
      canvas.getContext('2d').drawImage($('video'), 0, 0);
      await send(await new Promise(done => canvas.toBlob(done, 'image/jpeg', 0.85)));
      busy = false;
    };
    shot(); timer = setInterval(shot, 6000);
  };
}

if (demo) { $('demo').classList.add('on'); $('pad').hidden = false; take(sampleRoom()); }
draw();
zones().then(poll);
setInterval(poll, 1500);
setInterval(() => { if (fix && !demo) draw(); }, 5000);  // keeps "updated N s ago" honest
</script>
</body>
</html>
