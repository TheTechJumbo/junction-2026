[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "junction-care-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "opencv-python-headless==4.13.0.92",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema[format]>=4.23,<5"]

[tool.setuptools.packages.find]
include = ["contracts*", "backend*"]

[tool.setuptools.package-data]
"backend.privacy" = ["models/*.onnx", "models/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
markers = ["integration: requires isolated external services", "live: requires explicitly configured live credentials"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
